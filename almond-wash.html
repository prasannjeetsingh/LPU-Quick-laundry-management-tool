<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laundry — Almond Wash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ece5d6;
    --cream:#0a0a0a;
    --cream-dim:#1a1a1a;
    --indigo-mid:#223a63;
    --blue-branch:#2f5f8a;
    --blue-bright:#2d6aa8;
    --green-safe:#74946a;
    --gold-mid:#d9a441;
    --red-over:#b1483a;
    --moth-color:#8f8677;
    --font-display:'Fraunces',serif;
    --font-body:'Karla',sans-serif;
    --font-script:'Alex Brush',cursive;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:#0e1626;font-family:var(--font-body);color:var(--ink);-webkit-tap-highlight-color:transparent;}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--blue-bright);outline-offset:2px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  .app-shell{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--cream);
    display:flex;flex-direction:column;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;}

  /* ---------- Top bar (simplified) ---------- */
  .topbar{flex:0 0 auto;background:var(--cream);border-bottom:1px solid #262626;padding-bottom:12px;}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;}
  .page-title{font-family:var(--font-display);font-weight:600;font-size:1.3rem;color:var(--ink);}
  .icon-btn{background:var(--cream-dim);border:none;border-radius:11px;width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;}
  .icon-btn svg{width:20px;height:20px;}
  .icon-btn:active{background:#e6d9c0;}
  .day-row{display:flex;align-items:center;gap:9px;padding:0 16px;flex-wrap:wrap;}
  .day-pill{font-family:var(--font-script);font-weight:400;font-size:1.55rem;line-height:1;padding:6px 16px 9px;border-radius:999px;}
  .day-pill.day-allowed{background:#e0f0da;color:#355c2b;}
  .day-pill.day-blocked{background:#f7ded9;color:#7a2e22;}
  .day-icon{width:22px;height:22px;flex:0 0 auto;}
  .day-icon.icon-allowed{color:var(--blue-bright);}
  .day-icon.icon-blocked{color:var(--moth-color);}
  .day-note{font-size:.78rem;color:#b0a890;}

  /* ---------- Main / views ---------- */
  main{flex:1 1 auto;overflow:hidden;position:relative;}
  .view{display:none;height:100%;overflow-y:auto;padding:18px 16px 4px;-webkit-overflow-scrolling:touch;}
  .view.active{display:block;}

  .total-section{display:flex;flex-direction:column;align-items:center;position:relative;margin-bottom:20px;}
  .reset-btn{position:absolute;right:0;top:6px;background:none;border:none;color:var(--ink);opacity:.45;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .reset-btn:active{opacity:.85;}
  .reset-btn svg{width:18px;height:18px;}
  .total-wrap{position:relative;width:136px;height:136px;display:flex;align-items:center;justify-content:center;}
  .ring{width:136px;height:136px;}
  .ring-bg{fill:none;stroke:var(--cream-dim);stroke-width:10;}
  .ring-fg{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .5s ease, stroke .4s ease;}
  .total-wrap.state-green .ring-fg{stroke:var(--green-safe);}
  .total-wrap.state-yellow .ring-fg{stroke:var(--gold-mid);}
  .total-wrap.state-blue .ring-fg{stroke:var(--blue-bright);}
  .total-wrap.state-red .ring-fg{stroke:var(--red-over);}
  .total-wrap.state-red{animation:shakeWarn .4s ease;}
  .total-center{position:absolute;display:flex;flex-direction:column;align-items:center;}
  .total-number{font-family:var(--font-display);font-size:2.5rem;font-weight:600;line-height:1;}
  .total-of{font-size:.8rem;color:#9a9080;margin-top:2px;}
  .butterfly-badge{position:absolute;top:-8px;right:2px;width:30px;height:30px;color:var(--blue-bright);display:none;}
  .total-wrap.state-blue .butterfly-badge{display:block;animation:flutter 1.1s ease-in-out infinite;}

  .tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:6px;}
  .tile-grid .empty-state{grid-column:1/-1;}
  .tile{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.18);
    padding:12px 4px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;user-select:none;transition:transform .12s ease;aspect-ratio:1/1;
    box-shadow:0 3px 10px rgba(0,0,0,.28);

  .tile:nth-child(6n+1){background-position:18% 12%,18% 12%;}
  .tile:nth-child(6n+2){background-position:62% 8%,62% 8%;}
  .tile:nth-child(6n+3){background-position:85% 42%,85% 42%;}
  .tile:nth-child(6n+4){background-position:28% 68%,28% 68%;}
  .tile:nth-child(6n+5){background-position:70% 78%,70% 78%;}
  .tile:nth-child(6n){background-position:45% 40%,45% 40%;}
  .tile:active{transform:scale(.95);}
  .tile.pop{animation:pop .26s ease;}
  .tile-icon{width:32px;height:32px;color:#f5eee0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));}
  .tile-label{font-size:.7rem;text-align:center;line-height:1.15;color:#f7f2e7;padding:0 2px;
    text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .tile-badge{position:absolute;top:6px;right:6px;background:var(--blue-bright);color:#fff;font-size:.7rem;
    font-weight:700;min-width:19px;height:19px;border-radius:999px;display:flex;align-items:center;
    justify-content:center;padding:0 4px;border:1.5px solid rgba(255,255,255,.55);}
  .tile-minus{position:absolute;top:4px;left:4px;width:21px;height:21px;border-radius:999px;
    background:rgba(20,20,20,.92);border:1px solid rgba(255,255,255,.25);color:#ece5d6;font-size:1rem;
    line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .tile-minus:active{background:#000;}

  .submit-wrap{position:sticky;bottom:0;padding:14px 0 16px;
    background:linear-gradient(to top, var(--cream) 65%, rgba(250,243,230,0));}
  .submit-btn{width:100%;border:none;border-radius:14px;padding:14px;font-family:var(--font-display);
    font-weight:600;font-size:1rem;background:var(--blue-branch);color:#fff;cursor:pointer;}
  .submit-btn:active{background:var(--indigo-mid);}

  .history-title{font-family:var(--font-display);font-size:1.15rem;font-weight:600;margin:0 0 14px;}
  .history-card{background:#151515;border:1px solid #2a2a2a;border-radius:14px;padding:14px;margin-bottom:12px;}
  .history-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .history-top-right{display:flex;align-items:center;gap:8px;}
  .history-weekday{font-family:var(--font-display);font-weight:600;color:var(--blue-branch);font-size:1.02rem;}
  .history-total{font-size:.82rem;color:#b0a890;white-space:nowrap;}
  .history-delete{background:none;border:none;color:var(--red-over);opacity:.55;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 auto;}
  .history-delete:active{opacity:1;}
  .history-delete svg{width:16px;height:16px;}
  .history-date{font-size:.8rem;color:#9a9080;margin-top:2px;}
  .history-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .item-chip{background:var(--cream-dim);border-radius:999px;padding:3px 10px;font-size:.72rem;color:#d9d2c2;}
  .empty-state{text-align:center;color:#9a9080;padding:50px 14px;font-size:.88rem;line-height:1.5;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{flex:0 0 auto;display:flex;border-top:1px solid #262626;background:#111;}
  .nav-btn{flex:1;background:none;border:none;padding:10px 0 8px;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:#8a7d68;cursor:pointer;}
  .nav-btn.active{color:var(--blue-branch);}
  .nav-icon{width:23px;height:23px;}
  .nav-label{font-size:.66rem;}

  /* ---------- Modals ---------- */
  .modal{position:fixed;inset:0;background:rgba(15,15,15,.5);display:none;align-items:flex-end;
    justify-content:center;z-index:50;}
  .modal.open{display:flex;}
  .modal-box{background:var(--cream);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;
    max-height:82vh;overflow-y:auto;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-title{font-family:var(--font-display);font-weight:600;font-size:1.1rem;}
  .field-label{font-size:.8rem;color:#b0a890;margin-bottom:6px;display:block;font-weight:600;}
  .field-hint{font-size:.74rem;color:#8f8677;margin:-2px 0 10px;}
  .text-input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #333;
    font-family:var(--font-body);font-size:.95rem;margin-bottom:16px;background:#1a1a1a;color:var(--ink);}
  .settings-section{margin-bottom:20px;}
  .day-chips-row{display:flex;gap:6px;margin-bottom:4px;}
  .day-chip{flex:1;padding:10px 0;text-align:center;border-radius:10px;border:1px solid #333;
    background:#1a1a1a;font-size:.78rem;color:#b0a890;cursor:pointer;}
  .day-chip.active{background:var(--blue-branch);color:#fff;border-color:var(--blue-branch);}
  .manage-list{max-height:190px;overflow-y:auto;border:1px solid #333;border-radius:12px;margin-bottom:10px;background:#1a1a1a;}
  .manage-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
    border-bottom:1px solid #262626;font-size:.88rem;color:#d9d2c2;}
  .manage-row:last-child{border-bottom:none;}
  .manage-remove{background:#f7ded9;color:#7a2e22;border:none;width:24px;height:24px;border-radius:999px;
    font-size:1rem;line-height:1;cursor:pointer;flex:0 0 auto;}
  .add-row{display:flex;gap:8px;}
  .add-row .text-input{margin-bottom:0;flex:1;}
  .add-btn{width:44px;border:none;border-radius:10px;background:var(--blue-branch);color:#fff;
    font-size:1.3rem;cursor:pointer;flex:0 0 auto;}
  .modal-save-btn{width:100%;border:none;border-radius:12px;padding:13px;background:var(--blue-branch);
    color:#fff;font-weight:600;font-family:var(--font-display);cursor:pointer;}
  .confirm-message{font-size:.92rem;color:#d9d2c2;margin-bottom:20px;line-height:1.45;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{flex:1;border-radius:12px;padding:12px;font-weight:600;
    font-family:var(--font-display);cursor:pointer;border:none;font-size:.92rem;}
  #confirmNo{background:#262626;color:#d9d2c2;}
  #confirmYes{background:var(--blue-branch);color:#fff;}

  #toastContainer{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:center;
    z-index:70;pointer-events:none;}
  .toast{background:#23180c;color:#fff;padding:10px 18px;border-radius:999px;font-size:.84rem;
    opacity:0;transform:translateY(-8px);transition:opacity .25s ease, transform .25s ease;
    max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateY(0);}

  #loadingOverlay{position:fixed;inset:0;background:var(--indigo-mid);display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#fff;z-index:100;transition:opacity .3s ease;}
  #loadingOverlay.hidden{opacity:0;pointer-events:none;}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
    border-top-color:#fff;animation:spin .8s linear infinite;margin-bottom:12px;}
  .loading-text{font-family:var(--font-display);font-size:.9rem;color:rgba(255,255,255,.85);}

  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes flutter{0%,100%{transform:scale(1) rotate(-6deg);}50%{transform:scale(1.18) rotate(6deg);}}
  @keyframes shakeWarn{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Opening your laundry list…</div>

<script>
(function(){
  "use strict";

  var DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var STORAGE_KEY = 'almond-wash-data';
  var RING_R = 52, RING_C = 2 * Math.PI * RING_R;
  var TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4,7 L20,7 M9,7 L9,4 L15,4 L15,7 M6,7 L7,20 L17,20 L18,7"/></svg>';

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }

  function defaultClothes(){
    return [
      {id:'jeans', name:'Jeans', custom:false},
      {id:'pant', name:'Pant', custom:false},
      {id:'pyjama', name:'Pyjama', custom:false},
      {id:'shorts', name:'Shorts', custom:false},
      {id:'shirt', name:'Shirt', custom:false},
      {id:'t-shirt', name:'T-Shirt', custom:false},
      {id:'kurta', name:'Kurta', custom:false},
      {id:'skirt', name:'Skirt', custom:false},
      {id:'dupatta', name:'Dupatta', custom:false},
      {id:'bed-sheet', name:'Bed Sheet', custom:false},
      {id:'pillow-cover', name:'Pillow Cover', custom:false},
      {id:'towel', name:'Towel', custom:false},
      {id:'lab-coat', name:'Lab Coat', custom:false},
      {id:'hand-towel', name:'Hand Towel', custom:false},
      {id:'mm', name:'Mm', custom:false}
    ];
  }
  function countsFromClothes(list){
    var o = {};
    list.forEach(function(c){ o[c.id] = 0; });
    return o;
  }

  var state = {
    settings: { block: '', allowedDays: [2,5] },
    clothes: defaultClothes(),
    counts: countsFromClothes(defaultClothes()),
    history: []
  };
  state.counts = countsFromClothes(state.clothes);

  var el = {};
  function cacheElements(){
    ['loadingOverlay','settingsBtn','dayPill','dayIcon','dayPillNote','totalWrap','ringFg','totalNumber',
     'resetBtn','tileGrid','submitBtn','historyList','settingsModal','blockInput',
     'saveSettingsBtn','closeSettingsBtn','confirmModal','confirmMessage','confirmYes','confirmNo',
     'toastContainer','ariaLive','clothesManageList','newClothingInput','addClothingBtn'].forEach(function(id){
      el[id] = document.getElementById(id);
    });
    el.views = document.querySelectorAll('.view');
    el.navButtons = document.querySelectorAll('.nav-btn');
    el.dayChips = Array.prototype.slice.call(document.querySelectorAll('.day-chip'));
  }

  var pendingConfirmAction = null;
  var saveTimer = null;
  var saveFailureShown = false;

  function notifySaveIssue(){
    if(!saveFailureShown){
      saveFailureShown = true;
      showToast('Changes may not be saved on this device.');
    }
  }

  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{
        if(!window.storage){ notifySaveIssue(); return; }
        var p = window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
        if(p && typeof p.catch === 'function'){ p.catch(function(){ notifySaveIssue(); }); }
      }catch(e){ notifySaveIssue(); }
    }, 350);
  }

  function loadData(){
    return new Promise(function(resolve){
      try{
        if(!window.storage){ resolve(); return; }
        window.storage.get(STORAGE_KEY, false).then(function(res){
          if(res && res.value){
            try{
              var parsed = JSON.parse(res.value);
              state.settings = Object.assign({block:'', allowedDays:[2,5]}, parsed.settings || {});
              state.clothes = (Array.isArray(parsed.clothes) && parsed.clothes.length) ? parsed.clothes : defaultClothes();
              state.counts = (parsed.counts && typeof parsed.counts === 'object') ? parsed.counts : {};
              state.clothes.forEach(function(c){ if(typeof state.counts[c.id] !== 'number') state.counts[c.id] = 0; });
              state.history = Array.isArray(parsed.history) ? parsed.history : [];
            }catch(e){ /* keep defaults */ }
          }
          resolve();
        }).catch(function(){ resolve(); });
      }catch(e){ resolve(); }
    });
  }

  function getTotal(){
    return state.clothes.reduce(function(sum, c){ return sum + (state.counts[c.id] || 0); }, 0);
  }

  function iconIdFor(c){ return c.custom ? 'mm' : c.id; }

  function renderTiles(){
    if(state.clothes.length === 0){
      el.tileGrid.innerHTML = '<div class="empty-state">No clothing types yet.<br>Add some from Settings.</div>';
      return;
    }
    el.tileGrid.innerHTML = state.clothes.map(function(c){
      var n = state.counts[c.id] || 0;
      var safeName = escapeHtml(c.name);
      var minus = n > 0 ? '<button class="tile-minus" data-minus="' + c.id + '" aria-label="Remove one ' + safeName + '">&minus;</button>' : '';
      var badge = n > 0 ? '<span class="tile-badge">' + n + '</span>' : '';
      return '<div class="tile" data-id="' + c.id + '" role="button" tabindex="0" aria-label="' + safeName + ', ' + n + ' selected">' +
        minus + badge +
        '<svg class="tile-icon" aria-hidden="true"><use href="#icon-' + iconIdFor(c) + '"></use></svg>' +
        '<span class="tile-label">' + safeName + '</span></div>';
    }).join('');
  }

  function pulseTile(id){
    var target = el.tileGrid.querySelector('.tile[data-id="' + id + '"]');
    if(target){
      target.classList.add('pop');
      setTimeout(function(){ target.classList.remove('pop'); }, 260);
    }
  }

  function renderTotal(){
    var total = getTotal();
    el.totalNumber.textContent = total;
    var frac = Math.min(total, 9) / 9;
    el.ringFg.style.strokeDasharray = RING_C + ' ' + RING_C;
    el.ringFg.style.strokeDashoffset = RING_C * (1 - frac);
    var stateClass = 'state-green';
    if(total > 9) stateClass = 'state-red';
    else if(total === 9) stateClass = 'state-blue';
    else if(total >= 4) stateClass = 'state-yellow';
    el.totalWrap.className = 'total-wrap ' + stateClass;
    var msg = 'Total ' + total + ' of 9';
    if(total > 9) msg += ', over the usual limit';
    else if(total === 9) msg += ', right at the limit';
    el.ariaLive.textContent = msg;
  }

  function increment(id){
    state.counts[id] = (state.counts[id] || 0) + 1;
    afterCountChange(id);
  }
  function decrement(id){
    state.counts[id] = Math.max(0, (state.counts[id] || 0) - 1);
    afterCountChange(id);
  }
  function afterCountChange(id){
    persist();
    renderTiles();
    renderTotal();
    pulseTile(id);
  }

  function renderDayPill(){
    var now = new Date();
    var idx = now.getDay();
    var allowed = state.settings.allowedDays.indexOf(idx) !== -1;
    el.dayPill.textContent = DAY_NAMES[idx];
    el.dayPill.className = 'day-pill ' + (allowed ? 'day-allowed' : 'day-blocked');
    el.dayIcon.innerHTML = '<use href="#icon-' + (allowed ? 'butterfly' : 'moth') + '"></use>';
    el.dayIcon.setAttribute('class', 'day-icon ' + (allowed ? 'icon-allowed' : 'icon-blocked'));
    el.dayPillNote.textContent = allowed ? 'Laundry day — go ahead' : 'Not a laundry day for you';
  }

  function formatFull(date){
    return {
      weekday: DAY_NAMES[date.getDay()],
      day: date.getDate(),
      month: MONTH_NAMES[date.getMonth()],
      year: date.getFullYear(),
      full: DAY_NAMES[date.getDay()] + ', ' + date.getDate() + ' ' + MONTH_NAMES[date.getMonth()] + ' ' + date.getFullYear()
    };
  }

  function renderHistory(){
    if(state.history.length === 0){
      el.historyList.innerHTML = '<div class="empty-state">No submissions logged yet.<br>Once you submit your laundry, it will show up here.</div>';
      return;
    }
    el.historyList.innerHTML = state.history.map(function(entry){
      var chips = (entry.items || []).map(function(it){
        return '<span class="item-chip">' + escapeHtml(it.name) + ' × ' + it.count + '</span>';
      }).join('');
      var blockPart = entry.block ? ' · ' + escapeHtml(entry.block) : '';
      return '<div class="history-card">' +
        '<div class="history-top"><span class="history-weekday">' + entry.formatted.weekday + '</span>' +
        '<div class="history-top-right"><span class="history-total">' + entry.total + (entry.total === 1 ? ' item' : ' items') + '</span>' +
        '<button class="history-delete" data-delete-history="' + entry.id + '" aria-label="Delete this record">' + TRASH_SVG + '</button></div></div>' +
        '<div class="history-date">' + entry.formatted.day + ' ' + entry.formatted.month + ' ' + entry.formatted.year + blockPart + '</div>' +
        '<div class="history-chips">' + chips + '</div></div>';
    }).join('');
  }

  function showToast(msg){
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    el.toastContainer.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){
      t.classList.remove('show');
      setTimeout(function(){ t.remove(); }, 300);
    }, 2400);
  }

  function showConfirm(message, onConfirm){
    el.confirmMessage.textContent = message;
    pendingConfirmAction = onConfirm;
    el.confirmModal.classList.add('open');
  }
  function closeConfirm(){
    el.confirmModal.classList.remove('open');
    pendingConfirmAction = null;
  }

  function finalizeSubmit(now){
    var f = formatFull(now);
    var items = state.clothes
      .filter(function(c){ return (state.counts[c.id] || 0) > 0; })
      .map(function(c){ return { name: c.name, count: state.counts[c.id] }; });
    var total = getTotal();
    state.history.unshift({
      id: now.getTime(),
      formatted: f,
      total: total,
      items: items,
      block: state.settings.block
    });
    state.clothes.forEach(function(c){ state.counts[c.id] = 0; });
    persist();
    renderTiles();
    renderTotal();
    renderHistory();
    showToast('Submitted ' + total + (total === 1 ? ' item' : ' items') + ' · ' + f.full);
  }

  function doSubmit(){
    var total = getTotal();
    if(total === 0){
      showToast('Add at least one item before submitting.');
      return;
    }
    var now = new Date();
    var allowed = state.settings.allowedDays.indexOf(now.getDay()) !== -1;
    if(!allowed){
      var blockLabel = state.settings.block || 'your block';
      showConfirm('Today (' + DAY_NAMES[now.getDay()] + ') isn\'t set as a laundry day for ' + blockLabel + '. Submit anyway?', function(){
        finalizeSubmit(now);
      });
    } else {
      finalizeSubmit(now);
    }
  }

  function renderClothesManageList(){
    if(state.clothes.length === 0){
      el.clothesManageList.innerHTML = '<div class="manage-row">No clothing types yet — add one below.</div>';
      return;
    }
    el.clothesManageList.innerHTML = state.clothes.map(function(c){
      return '<div class="manage-row"><span>' + escapeHtml(c.name) + '</span>' +
        '<button class="manage-remove" data-remove-cloth="' + c.id + '" aria-label="Remove ' + escapeHtml(c.name) + '">&times;</button></div>';
    }).join('');
  }

  function addClothingType(){
    var name = el.newClothingInput.value.trim();
    if(!name) return;
    var base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '') || 'item';
    var id = base, i = 1;
    while(state.clothes.some(function(c){ return c.id === id; })){ i++; id = base + '-' + i; }
    state.clothes.push({ id: id, name: name, custom: true });
    state.counts[id] = 0;
    el.newClothingInput.value = '';
    persist();
    renderClothesManageList();
    renderTiles();
    renderTotal();
  }

  function removeClothingType(id){
    var item = state.clothes.filter(function(c){ return c.id === id; })[0];
    if(!item) return;
    showConfirm('Remove "' + item.name + '" from your tile list? Past submissions won\'t be affected.', function(){
      state.clothes = state.clothes.filter(function(c){ return c.id !== id; });
      delete state.counts[id];
      persist();
      renderClothesManageList();
      renderTiles();
      renderTotal();
      showToast('Removed ' + item.name);
    });
  }

  function openSettings(){
    el.blockInput.value = state.settings.block || '';
    el.dayChips.forEach(function(chip){
      var idx = Number(chip.getAttribute('data-day'));
      chip.classList.toggle('active', state.settings.allowedDays.indexOf(idx) !== -1);
    });
    renderClothesManageList();
    el.settingsModal.classList.add('open');
  }
  function closeSettings(){
    el.settingsModal.classList.remove('open');
  }
  function saveSettingsHandler(){
    state.settings.block = el.blockInput.value.trim();
    state.settings.allowedDays = el.dayChips.filter(function(c){ return c.classList.contains('active'); })
      .map(function(c){ return Number(c.getAttribute('data-day')); });
    persist();
    renderDayPill();
    closeSettings();
    showToast('Settings saved');
  }

  function switchView(target){
    el.views.forEach(function(v){ v.classList.toggle('active', v.id === target); });
    el.navButtons.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-target') === target); });
  }

  function attachEvents(){
    el.tileGrid.addEventListener('click', function(e){
      var minusBtn = e.target.closest ? e.target.closest('[data-minus]') : null;
      if(minusBtn){ e.stopPropagation(); decrement(minusBtn.getAttribute('data-minus')); return; }
      var tile = e.target.closest ? e.target.closest('.tile') : null;
      if(tile){ increment(tile.getAttribute('data-id')); }
    });
    el.tileGrid.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        var tile = e.target.closest ? e.target.closest('.tile') : null;
        if(tile){ e.preventDefault(); increment(tile.getAttribute('data-id')); }
      }
    });

    el.resetBtn.addEventListener('click', function(){
      if(getTotal() === 0) return;
      showConfirm('Clear all current counts? This does not affect your submission history.', function(){
        state.clothes.forEach(function(c){ state.counts[c.id] = 0; });
        persist();
        renderTiles();
        renderTotal();
        showToast('Counts cleared');
      });
    });

    el.submitBtn.addEventListener('click', doSubmit);

    el.navButtons.forEach(function(btn){
      btn.addEventListener('click', function(){ switchView(btn.getAttribute('data-target')); });
    });

    el.settingsBtn.addEventListener('click', openSettings);
    el.closeSettingsBtn.addEventListener('click', closeSettings);
    el.saveSettingsBtn.addEventListener('click', saveSettingsHandler);
    el.dayChips.forEach(function(chip){
      chip.addEventListener('click', function(){ chip.classList.toggle('active'); });
    });
    el.addClothingBtn.addEventListener('click', addClothingType);
    el.newClothingInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); addClothingType(); }
    });
    el.clothesManageList.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('[data-remove-cloth]') : null;
      if(btn){ removeClothingType(btn.getAttribute('data-remove-cloth')); }
    });
    el.historyList.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('[data-delete-history]') : null;
      if(!btn) return;
      var id = Number(btn.getAttribute('data-delete-history'));
      showConfirm('Delete this submission record? This can\'t be undone.', function(){
        state.history = state.history.filter(function(h){ return h.id !== id; });
        persist();
        renderHistory();
        showToast('Deleted');
      });
    });

    el.confirmYes.addEventListener('click', function(){
      var action = pendingConfirmAction;
      closeConfirm();
      if(action) action();
    });
    el.confirmNo.addEventListener('click', closeConfirm);

    [el.settingsModal, el.confirmModal].forEach(function(modal){
      modal.addEventListener('click', function(e){
        if(e.target === modal) modal.classList.remove('open');
      });
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        el.settingsModal.classList.remove('open');
        el.confirmModal.classList.remove('open');
      }
    });
  }

  function renderAll(){
    renderTiles();
    renderTotal();
    renderDayPill();
    renderHistory();
  }

  document.addEventListener('DOMContentLoaded', function(){
    cacheElements();
    attachEvents();
    loadData().then(function(){
      renderAll();
      el.loadingOverlay.classList.add('hidden');
    });
  });
})();
</script>
</body>
</html>
